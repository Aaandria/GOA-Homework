<!-- 5.შექმენი თამაში სადაც მომხმარებელი თამაშობს 4 რაუნდს, ყოველ რაუნდში ჩნდება განსხვავებული ფერის 
 ობიექტი სხვადასხვა დროს, მომხმარებელმა უნდა დააჭიროს რაც შეიძლება სწრაფად, ბოლოს გამოიტანე:
ყველა დრო
საუკეთესო დრო
საშუალო დრო -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-3xl rounded-3xl bg-white shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-900">4-Round Reaction Game</h1>
            <p class="mt-3 text-slate-600">Wait for the object to appear, click it quickly, and compare your times.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5 text-center">
                <div class="text-3xl font-semibold text-slate-900" id="roundDisplay">Round 0 / 4</div>
                <div class="text-sm uppercase tracking-[0.18em] text-slate-500 mt-2">Round</div>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5 text-center">
                <div class="text-3xl font-semibold text-slate-900" id="bestDisplay">—</div>
                <div class="text-sm uppercase tracking-[0.18em] text-slate-500 mt-2">Best time</div>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5 text-center">
                <div class="text-3xl font-semibold text-slate-900" id="avgDisplay">—</div>
                <div class="text-sm uppercase tracking-[0.18em] text-slate-500 mt-2">Average</div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <button id="startButton" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-sky-600 text-white 
            text-lg font-semibold transition hover:bg-sky-700">Start Game</button>
            <div class="space-y-2 text-center sm:text-right">
                <p id="status" class="text-lg text-slate-800">Press Start to begin round 1.</p>
                <p id="timerInfo" class="text-slate-500"></p>
            </div>
        </div>

        <div class="relative h-[360px] rounded-[32px] border border-dashed border-slate-300 bg-slate-50 overflow-hidden">
            <div id="target" class="absolute hidden rounded-full shadow-xl shadow-slate-400/20 cursor-pointer"></div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const status = document.getElementById('status');
        const timerInfo = document.getElementById('timerInfo');
        const roundDisplay = document.getElementById('roundDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const avgDisplay = document.getElementById('avgDisplay');
        const target = document.getElementById('target');
        const gameArea = document.querySelector('.relative');

        const colors = ['bg-sky-500', 'bg-emerald-500', 'bg-orange-500', 'bg-fuchsia-500'];
        const delays = [900, 1100, 1300, 1500];

        let round = 0;
        let times = [];
        let startTime = 0;
        let objectTimeout = null;
        let waitingForTarget = false;
        let gameActive = false;

        function resetTarget() {
            target.className = 'absolute hidden rounded-full shadow-xl shadow-slate-400/20 cursor-pointer';
            target.style.width = '';
            target.style.height = '';
            target.style.left = '';
            target.style.top = '';
        }

        function updateStats() {
            roundDisplay.textContent = `Round ${round} / 4`;
            if (times.length === 0) {
                bestDisplay.textContent = '—';
                avgDisplay.textContent = '—';
                return;
            }
            const best = Math.min(...times);
            const avg = Math.round(times.reduce((sum, value) => sum + value, 0) / times.length);
            bestDisplay.textContent = `${best} ms`;
            avgDisplay.textContent = `${avg} ms`;
        }

        function getRandomPosition(size) {
            const bounds = gameArea.getBoundingClientRect();
            const x = Math.random() * (bounds.width - size);
            const y = Math.random() * (bounds.height - size);
            return { x, y };
        }

        function showTarget() {
            const size = 80;
            const position = getRandomPosition(size);
            const colorClass = colors[round - 1] || 'bg-sky-500';
            target.className = `absolute rounded-full shadow-xl shadow-slate-400/20 cursor-pointer ${colorClass}`;
            target.style.width = `${size}px`;
            target.style.height = `${size}px`;
            target.style.left = `${position.x}px`;
            target.style.top = `${position.y}px`;
            target.classList.remove('hidden');
            waitingForTarget = true;
            startTime = performance.now();
            status.textContent = 'Click the object now!';
            timerInfo.textContent = '';
        }

        function startRound() {
            round += 1;
            updateStats();
            status.textContent = 'Get ready...';
            timerInfo.textContent = 'Wait for the object to appear.';
            resetTarget();
            waitingForTarget = false;
            const delay = delays[Math.min(round - 1, delays.length - 1)] + Math.random() * 800;
            objectTimeout = setTimeout(showTarget, delay);
        }

        function finishGame() {
            gameActive = false;
            resetTarget();
            startButton.disabled = false;
            startButton.textContent = 'Restart Game';
            status.textContent = 'Game complete!';
            timerInfo.textContent = `Total time: ${times.reduce((sum, value) => sum + value, 0)} ms.`;
            updateStats();
        }

        startButton.addEventListener('click', () => {
            clearTimeout(objectTimeout);
            round = 0;
            times = [];
            gameActive = true;
            startButton.disabled = true;
            startButton.textContent = 'Playing...';
            startRound();
        });

        target.addEventListener('click', () => {
            if (!waitingForTarget || !gameActive) return;
            waitingForTarget = false;
            const reactionTime = Math.round(performance.now() - startTime);
            times.push(reactionTime);
            status.textContent = `Round ${round} reaction: ${reactionTime} ms`;
            timerInfo.textContent = 'Prepare for the next round.';
            resetTarget();
            updateStats();

            if (round >= 4) {
                finishGame();
                return;
            }

            setTimeout(startRound, 900);
        });
    </script>
</body>
</html>
