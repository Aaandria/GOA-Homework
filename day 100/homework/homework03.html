<!-- 3.შექმენი თამაში სადაც მომხმარებელს აქვს 4 წამი და ამ დროში ეკრანზე ჩნდება random ადგილას პატარა ღილაკი, 
მომხმარებელმა უნდა დააჭიროს რაც შეიძლება ბევრჯერ, ბოლოს გამოიტანე მაქსიმალური დაჭერის რაოდენობა -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-3xl rounded-3xl bg-white shadow-2xl p-8">
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-slate-900">4-Second Click Game</h1>
            <p class="mt-3 text-slate-600">Click the button as many times as you can in 4 seconds.</p>
        </div>

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
            <button id="startButton" class="w-full md:w-auto px-6 py-3 rounded-2xl bg-sky-600 text-white 
            text-lg font-semibold hover:bg-sky-700 transition">Start Game</button>
            <div class="space-y-2 text-center md:text-left">
                <p id="message" class="text-xl text-slate-800">Press Start to begin.</p>
                <p id="result" class="text-slate-500"></p>
            </div>
        </div>

        <div id="gameArea" class="relative h-[420px] rounded-3xl bg-slate-50 border border-slate-200 overflow-hidden hidden">
            <button id="clickButton" class="absolute cursor-pointer bg-red-500 hover:bg-red-600 
            text-white font-bold py-2 px-4 rounded-full"></button>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const message = document.getElementById('message');
        const result = document.getElementById('result');
        const gameArea = document.getElementById('gameArea');
        const clickButton = document.getElementById('clickButton');

        let clickCount = 0;
        let gameActive = false;
        let timer;

        function getRandomPosition(size) {
            const areaRect = gameArea.getBoundingClientRect();
            const x = Math.random() * (areaRect.width - size);
            const y = Math.random() * (areaRect.height - size);
            return { x, y };
        }

        function updateButtonClick() {
            const size = 50;
            const { x, y } = getRandomPosition(size);

            clickButton.style.width = `${size}px`;
            clickButton.style.height = `${size}px`;
            clickButton.style.left = `${x}px`;
            clickButton.style.top = `${y}px`;
        }

        function endGame() {
            gameActive = false;
            clearTimeout(timer);
            clickButton.classList.add('hidden');
            result.textContent = `Maximum clicks: ${clickCount}`;
            startButton.disabled = false;
            startButton.textContent = 'Start Game';
        }

        function startGame() {
            clickCount = 0;
            gameActive = true;
            gameArea.classList.remove('hidden');
            clickButton.classList.remove('hidden');
            startButton.disabled = true;
            startButton.textContent = 'Playing...';
            message.textContent = 'Click the button as many times as you can in 4 seconds.';
            result.textContent = '';

            updateButtonClick();

            timer = setTimeout(() => {
                endGame();
            }, 4000);
        }

        clickButton.addEventListener('click', () => {
            if (!gameActive) return;
            clickCount += 1;
            updateButtonClick();
        });

        startButton.addEventListener('click', startGame);
    </script>
</body>
</html>
