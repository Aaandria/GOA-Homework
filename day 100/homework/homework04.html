<!-- 4.შექმენი თამაში სადაც ღილაკზე დაჭერის შემდეგ 4 ბლოკი ანათებს რიგრიგობით, შემდეგ კი ერთ-ერთი ბლოკი რჩება 
 განათებული შემთხვევით, მომხმარებელმა უნდა დააჭიროს სწორ ბლოკს და გამოიტანე არის თუ არა სწორი და რამდენი დრო დაჭირდა -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-3xl rounded-3xl bg-white shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-900">Memory Block Game</h1>
            <p class="mt-3 text-slate-600">Watch the blocks light up, then click the one left lit at the end.</p>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <button id="startButton" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-sky-600 text-white 
            text-lg font-semibold hover:bg-sky-700 transition">Start Sequence</button>
            <div class="space-y-2 text-center sm:text-right">
                <p id="status" class="text-lg text-slate-800">Press Start to begin.</p>
                <p id="feedback" class="text-slate-500"></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="block-button h-40 rounded-3xl bg-slate-200 shadow-inner transition" data-index="0"></div>
            <div class="block-button h-40 rounded-3xl bg-slate-200 shadow-inner transition" data-index="1"></div>
            <div class="block-button h-40 rounded-3xl bg-slate-200 shadow-inner transition" data-index="2"></div>
            <div class="block-button h-40 rounded-3xl bg-slate-200 shadow-inner transition" data-index="3"></div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const status = document.getElementById('status');
        const feedback = document.getElementById('feedback');
        const blocks = Array.from(document.querySelectorAll('.block-button'));

        let activeIndex = null;
        let sequenceRunning = false;
        let gameActive = false;
        let startTime = 0;
        let sequenceTimeouts = [];

        function resetBlocks() {
            blocks.forEach(block => {
                block.classList.remove('bg-yellow-300', 'bg-sky-500', 'ring-4', 'ring-sky-400');
                block.classList.add('bg-slate-200');
            });
        }

        function lightBlock(index, duration, callback) {
            const block = blocks[index];
            block.classList.remove('bg-slate-200');
            block.classList.add('bg-yellow-300', 'ring-4', 'ring-yellow-300');

            const timeout = setTimeout(() => {
                block.classList.remove('bg-yellow-300', 'ring-4', 'ring-yellow-300');
                block.classList.add('bg-slate-200');
                if (callback) callback();
            }, duration);

            sequenceTimeouts.push(timeout);
        }

        function showFinalBlock(index) {
            const block = blocks[index];
            block.classList.remove('bg-slate-200');
            block.classList.add('bg-sky-500', 'ring-4', 'ring-sky-400');
        }

        function startSequence() {
            resetBlocks();
            sequenceRunning = true;
            gameActive = false;
            startButton.disabled = true;
            status.textContent = 'Watch the blocks lighting up...';
            feedback.textContent = '';
            activeIndex = null;

            let delay = 0;
            blocks.forEach((_, index) => {
                const timeout = setTimeout(() => {
                    lightBlock(index, 500);
                }, delay);
                sequenceTimeouts.push(timeout);
                delay += 600;
            });

            const finalIndex = Math.floor(Math.random() * blocks.length);
            const finalDelay = delay;

            const finalTimeout = setTimeout(() => {
                showFinalBlock(finalIndex);
                activeIndex = finalIndex;
                sequenceRunning = false;
                gameActive = true;
                status.textContent = 'Click the block that stays lit.';
                startTime = performance.now();
                startButton.disabled = false;
            }, finalDelay);

            sequenceTimeouts.push(finalTimeout);
        }

        function stopSequence() {
            sequenceTimeouts.forEach(timeout => clearTimeout(timeout));
            sequenceTimeouts = [];
        }

        function handleBlockClick(event) {
            if (!gameActive) return;
            const block = event.currentTarget;
            const clickedIndex = Number(block.dataset.index);
            gameActive = false;
            const elapsed = Math.round(performance.now() - startTime);
            if (clickedIndex === activeIndex) {
                feedback.textContent = `Correct! Reaction time: ${elapsed} ms.`;
                status.textContent = 'Nice job.';
            } else {
                feedback.textContent = `Wrong block. Reaction time: ${elapsed} ms.`;
                status.textContent = 'Try again.';
            }
            startButton.textContent = 'Try again';
        }

        startButton.addEventListener('click', () => {
            stopSequence();
            resetBlocks();
            startSequence();
        });

        blocks.forEach(block => {
            block.addEventListener('click', handleBlockClick);
        });
    </script>
</body>
</html>
