<!-- 1) შექმენი დივი რომელზეც მომხმარებელი დააჭერს.
2) დაჭერის შემდეგ უნდა გამოდიოდეს მილიწამები იმის შემდეგ რაც თამაში დაიწყება
3) გასტილეთ tailwind cssით ძალიან კარგად
4) გქონდეთ მეტი ფერები
5) დაამატეთ რო თუ ძალიან ადრე დააწვება მომხმარებელი აღარ გამწვანდეს -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen items-center justify-center bg-black">
    <div class="flex flex-col items-center justify-center bg-gray-800 p-8 rounded-lg">
        <p class="text-center text-2xl font-bold text-white mb-4">Click the box when it turns green!</p>
        <button id="clickButton" class="w-48 h-48 bg-red-500 rounded-lg cursor-pointer"></button>
        <p id="message" class="text-center text-xl font-bold mt-4 text-white"></p>
        <button id="startButton" class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Start!
        </button>
    </div>

    <script>
        const clickButton = document.getElementById('clickButton');
        const message = document.getElementById('message');
        const startButton = document.getElementById('startButton');

        let gameStarted = false;
        let timeout;
        let startTime;

        startButton.addEventListener('click', () => {
            if (gameStarted) return;
            gameStarted = true;
            message.textContent = 'Get ready...';
            clickButton.classList.remove('bg-red-500');
            clickButton.classList.add('bg-gray-500');
            timeout = setTimeout(() => {
                clickButton.classList.remove('bg-gray-500');
                clickButton.classList.add('bg-green-500');
                message.textContent = 'Click now!';
                startTime = Date.now();
            }, Math.random() * 3000 + 1000);
        });

        clickButton.addEventListener('click', () => {
            if (!gameStarted) return;
            if (clickButton.classList.contains('bg-green-500')) {
                const endTime = Date.now();
                const reactionTime = endTime - startTime;
                message.textContent = `Your reaction time: ${reactionTime} ms`;
            } else {
                message.textContent = 'Too early! Try again.';
                clearTimeout(timeout);
            }
            gameStarted = false;
            clickButton.classList.remove('bg-green-500', 'bg-gray-500');
            clickButton.classList.add('bg-red-500');
        });
    </script>
</body>
</html>
