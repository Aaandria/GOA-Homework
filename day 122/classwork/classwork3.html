<!-- 3) შექმენი ოთხი ელემენტი: div#great-grandparent -> div#grandparent -> div#parent -> button#child.
ოთხივეს დაუმატე click ივენთი, რომელიც კონსოლში დაბეჭდავს შესაბამის სახელს (მაგ: "Parent clicked").
დააჭირე button#child-ს და დააკვირდი, როგორ ავა ივენთი სულ ზემოთ. კომენტარებში დაწერე, რა თანმიმდევრობით 
დაიბეჭდა კონსოლში მესიჯები და რატომ. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="great-grandparent">great-grandparent
        <div id="grandparent">grandparent
            <div id="parent">parent
                <button id="child">child</button>
            </div>
        </div>
    </div>
    <script>
        const greatGrandparent = document.getElementById("great-grandparent")
        const grandparent = document.getElementById("grandparent")
        const parent = document.getElementById("parent")
        const child = document.getElementById("child")

        greatGrandparent.addEventListener("click", () => {
            console.log("great-grandparent clicked")
        })
        grandparent.addEventListener("click", () => {
            console.log("grandparent clicked")
        })
        parent.addEventListener("click", () => {
            console.log("parent clicked")
        })
        child.addEventListener("click", () => {
            console.log("child clicked")
        })

        //კონსოლში დაიბეჭდა შემდეგი მესიჯები: "child clicked", "parent clicked", "grandparent clicked", "great-grandparent clicked"
        //რადგან event bubbling-ი ავიდა ზემოთ და ყველა ელემენტმა შეასრულა თავისი click ივენთი
    </script>
</body>
</html>
