<!-- 6) keydown Event-ში შეამოწმე Space ღილაკი (e.code === "Space") და გამოიტანე "Jump". -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.addEventListener("keydown", (e) => {
            if(e.code == "Space"){
                console.log("Jump")
            } else{
                e.code
            }
        })
    </script>
</body>
</html>
