<!-- 2) შექმენი button, რომლის შიგნით იქნება span. click Listener დაამატე მხოლოდ button-ს. დააჭირე span-ს და დაბეჭდე:
e.target
e.currentTarget
კომენტარებში ახსენი, რატომ განსხვავდება მათი მნიშვნელობები. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn"><span>click</span></button>

    <script>
        const btn = document.getElementById("btn")

        btn.addEventListener("click", (e) => {
            console.log(e.target)
            console.log(e.currentTarget)
        })

        // e.target არის ობიექტი რომელზე მოქმედებისას აქტიურდება event-ი
        // e.currentTarget არის ობიექტი რომელიც ასრულებს ამ event-ს
    </script>
</body>
</html>
